---
- name: Check the seat label
  ansible.builtin.assert:
    that:
      - island_seat is match('^[a-z0-9][a-z0-9-]{0,24}$')
    fail_msg: Use 1 to 25 lowercase letters, digits or hyphens for the page label.
- name: Read the sealed page
  ansible.builtin.include_vars:
    file: "{{ role_path }}/files/page.yml"
- name: Install Apache
  ansible.builtin.dnf:
    name: httpd
    state: present
- name: Start Apache
  ansible.builtin.service:
    name: httpd
    state: started
- name: Write this seat's page
  ansible.builtin.copy:
    dest: "/var/www/html/island-{{ island_seat }}.txt"
    content: "{{ treasure_page }}\n"
    mode: "0644"
- name: Read the page over HTTP from the managed node
  ansible.builtin.uri:
    url: "http://127.0.0.1/island-{{ island_seat }}.txt"
    return_content: true
  register: island_page
- name: Display the treasure
  ansible.builtin.debug:
    msg: "{{ island_page.content | trim }}"
