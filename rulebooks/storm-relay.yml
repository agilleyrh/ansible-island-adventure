---
- name: Route storm observations
  hosts: all
  sources:
    - name: station_reports
      ansible.eda.webhook:
        host: 127.0.0.1
        port: 5000
  rules:
    - name: Dispatch the harbor launch
      condition: event.payload.zone == "harbor" and event.payload.wind >= 40
      action:
        run_job_template:
          name: "{{ dispatch_template }}"
          organization: Workshop
